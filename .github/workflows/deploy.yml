name: Deploy to Cloudflare Pages

# Publishes public/ to the Cloudflare Pages project that serves color.kandyphoenix.com,
# on every push to main (and by hand from the Actions tab).
# Uses the repository secret CLOUDFLARE_API_TOKEN (Pages: Edit), the same token Puzzle Parlor uses.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d3aefe8ad2b7a8399b3f47238cde9599
      DOMAIN: color.kandyphoenix.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret to this repository (Settings > Secrets and variables > Actions). Use the same token as Puzzle Parlor."
            exit 1
          fi
      - name: Find the Pages project that serves the site
        id: proj
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -sS "$api?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > projects.json
          name=$(python3 - <<'PY'
          import json, os
          d = json.load(open('projects.json'))
          if not d.get('success'): raise SystemExit('Cloudflare said: %s' % d.get('errors'))
          dom = os.environ['DOMAIN']
          hits = [p['name'] for p in d['result'] if dom in (p.get('domains') or [])]
          print('projects:', ', '.join(f"{p['name']} {p.get('domains')}" for p in d['result']), file=__import__('sys').stderr)
          print(hits[0] if hits else '')
          PY
          )
          if [ -z "$name" ]; then echo "::error::No Pages project has $DOMAIN attached"; exit 1; fi
          echo "Deploying to project: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy public --project-name="${{ steps.proj.outputs.name }}" --branch=main --commit-dirty=true
      - name: Check the live site
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/")
          echo "https://$DOMAIN/ answered $code"
